[project]
name = "insilico-api-tests"
version = "0.1.0"
description = "API test layer for the simulation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "schemathesis>=3.36",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: request/response shape and status codes",
    "functional: behaviour against hand-computed expectations",
    "invariant: properties that must hold for every input",
    "fuzz: schema-driven fuzzing, slower",
]
filterwarnings = ["ignore::DeprecationWarning"]
